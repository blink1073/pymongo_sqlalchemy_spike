[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mongosql-dbapi-spike"
version = "0.1.0"
description = "Spike: PEP-249 DBAPI and SQLAlchemy dialect over MongoSQL"
requires-python = ">=3.11"
dependencies = ["pymongo>=4.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "sqlalchemy>=2.0"]

[project.entry-points."sqlalchemy.dialects"]
mongosql = "mongosql_sqlalchemy.dialect:MongoSQLDialect"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ported upstream classes keep their CPython names (not Test*-prefixed).
python_classes = ["ModuleTests", "ConnectionTests", "CursorTests",
                  "ReadOnlyTests"]
